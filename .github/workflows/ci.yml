name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The runtime imports torch/chatterbox, far too heavy for CI. This job proves
      # every script parses, the stdlib-only modules import, and no audio is tracked.
      - name: Byte-compile every script
        run: python -m compileall -q scripts
      - name: Stdlib-only modules import
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import voice_config, voice_client, prepare_reference; print('imports ok')"
      - name: Argument parsing responds
        run: python scripts/prepare_reference.py --help > /dev/null
      - name: No audio artefacts tracked
        run: |
          if git ls-files | grep -qiE '\.(wav|mp3|m4a|flac)$'; then
            echo "audio artefacts must never be committed"; exit 1
          fi
          echo "clean"
